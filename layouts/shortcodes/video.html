{{/*

    ## Native HTML5 Video

    Renders a <video> element with the browser's built-in controls. No
    JavaScript or external player library is loaded.

    ### Params

    - `mp4`   required. URL or path to an MP4 source.
    - `webm`  optional. URL or path to a WebM source.
    - `ogv`   optional. URL or path to an Ogg source.
    - `poster` optional. Preview image (16:9). Defaults to the theme poster.

    ### Examples

    - Positional (mp4, webm, ogv, poster):

      {{% video "/blog/media/post/x/clip.mp4" "/blog/media/post/x/clip.webm" %}}

    - Named:

      {{% video mp4="/blog/media/post/x/clip.mp4" poster="/blog/media/post/x/cover.jpg" %}}

*/}}

{{- $poster := resources.Get (.Site.Params.poster | default "images/poster.jpg") -}}

{{- if .IsNamedParams -}}
  {{- $mp4 := .Get "mp4" -}}
  {{- $webm := .Get "webm" -}}
  {{- $ogv := .Get "ogv" -}}
  {{- $posterURL := or (.Get "poster") $poster.RelPermalink -}}
  <video class="native-video" controls preload="metadata" playsinline poster="{{ $posterURL }}">
    {{- with $mp4 }}<source src="{{ . }}" type="video/mp4">{{ end }}
    {{- with $webm }}<source src="{{ . }}" type="video/webm">{{ end }}
    {{- with $ogv }}<source src="{{ . }}" type="video/ogg">{{ end }}
    <p>Your browser does not support embedded video.</p>
  </video>
{{- else -}}
  {{- $posterURL := cond (isset .Params 3) (.Get 3) $poster.RelPermalink -}}
  <video class="native-video" controls preload="metadata" playsinline poster="{{ $posterURL }}">
    {{- with .Get 0 }}<source src="{{ . }}" type="video/mp4">{{ end }}
    {{- if isset .Params 1 }}<source src="{{ .Get 1 }}" type="video/webm">{{ end }}
    {{- if isset .Params 2 }}<source src="{{ .Get 2 }}" type="video/ogg">{{ end }}
    <p>Your browser does not support embedded video.</p>
  </video>
{{- end -}}
